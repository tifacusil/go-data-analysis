name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/tifacusil/data-analysis

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate proto stubs
        run: bash scripts/gen_proto.sh

      - name: Lint
        run: |
          pip install flake8
          flake8 app/ services/ main.py --max-line-length=120 --extend-ignore=E501

      - name: Unit tests
        run: python -m pytest tests/unit -v

  cdct:
    name: CDCT — Provider verification
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate proto stubs
        run: bash scripts/gen_proto.sh

      - name: Run provider verification
        env:
          ANALYSIS__REDIS__HOST: localhost
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: python -m pytest tests/cdct -v

  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: [test, cdct]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
